name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp run check
      - run: vp run --filter @voidpress/content-query-sveltekit check
      - run: vp exec --filter @content-query/benchmarks playwright install --with-deps chromium
      - run: vp test run --coverage
      - run: vp run build:website
