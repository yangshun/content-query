packages:
  - packages/*
  - examples/*
  - benchmarks
  - benchmarks/apps/*
  - website

onlyBuiltDependencies:
  - "@parcel/watcher"
  - better-sqlite3
  - esbuild
  - lmdb
  - msgpackr-extract
  - workerd

catalog:
  "@void/md": 1.1.12
  "@void/react": 1.1.12
  vite: npm:@voidzero-dev/vite-plus-core@^1.3.0
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  void: 1.1.12

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
